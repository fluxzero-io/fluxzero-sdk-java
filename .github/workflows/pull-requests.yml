name: Build PR

on:
  pull_request:
    branches: [ main ]

env:
  BUILD_ENVIRONMENT: github

jobs:
  build-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Verify repository normalization
        run: |
          git add --renormalize .
          if ! git diff --cached --quiet; then
            git diff --cached --stat
            echo "::error::Tracked files are not normalized according to .gitattributes"
            exit 1
          fi

      - name: Install Java and Maven
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Test Maven Central publication recovery
        run: bash .github/scripts/recover-central-publication.test.sh

      - name: Run Maven build
        run: ./mvnw -B install
