name: Build PR

on:
  pull_request:
    branches: [ main, next/2.0, 1.x ]

env:
  BUILD_ENVIRONMENT: github

jobs:
  build-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          # The PR merge commit and its parents are enough to inspect the complete merged diff.
          fetch-depth: 2

      - name: Classify PR changes
        id: changes
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_MERGE: ${{ github.sha }}
        run: python3 .github/scripts/classify-changes.py "$PR_BASE" "$PR_MERGE" >> "$GITHUB_OUTPUT"

      - name: Validate documentation-only changes
        if: steps.changes.outputs.documentation_only == 'true'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_MERGE: ${{ github.sha }}
        run: |
          git diff --check "$PR_BASE" "$PR_MERGE"
          echo "Only documentation changed; full SDK build is unnecessary." >> "$GITHUB_STEP_SUMMARY"

      - name: Test PR change classification
        run: python3 .github/scripts/classify-changes.test.py

      - name: Verify repository normalization
        run: |
          git add --renormalize .
          if ! git diff --cached --quiet; then
            git diff --cached --stat
            echo "::error::Tracked files are not normalized according to .gitattributes"
            exit 1
          fi

      - name: Install Java and Maven
        if: steps.changes.outputs.documentation_only != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          check-latest: true
          cache: 'maven'

      - name: Test release version policy
        run: bash .github/scripts/resolve-release-version.test.sh

      - name: Validate agent documentation graph
        run: |
          python3 .github/scripts/validate-agent-docs.py
          python3 .github/scripts/build-agent-docs.test.py

      - name: Run Maven build
        if: steps.changes.outputs.documentation_only != 'true'
        run: ./mvnw -B -Dtest.forks=1 install

      - name: Preserve test reports and output
        if: always() && steps.changes.outputs.documentation_only != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: warn
          retention-days: 14

      - name: Check executor isolation
        if: steps.changes.outputs.documentation_only != 'true'
        run: |
          python3 .github/scripts/check-executor-isolation.test.py
          python3 .github/scripts/check-executor-isolation.py

      - name: Qualify executable OpenAPI packaging
        if: steps.changes.outputs.documentation_only != 'true'
        run: bash .github/scripts/test-openapi-packaging.sh

      - name: Verify standard Maven publication and release attachments
        if: steps.changes.outputs.documentation_only != 'true'
        run: |
          repository="$RUNNER_TEMP/maven-publication"
          ./mvnw -B -Dgpg.skip -DskipTests deploy \
            "-DaltDeploymentRepository=fluxzero::file://$repository"
          for artifact in fluxzero-sdk-java fluxzero-bom common sdk test-server proxy; do
            test -d "$repository/io/fluxzero/$artifact"
          done
          for artifact in common sdk test-server proxy; do
            test "$(find "$repository/io/fluxzero/$artifact" -name '*-sources.jar' | wc -l)" -gt 0
            test "$(find "$repository/io/fluxzero/$artifact" -name '*-javadoc.jar' | wc -l)" -gt 0
          done
          for artifact in annotation-processor-tests java-downstream-project kotlin-downstream-project; do
            test ! -e "$repository/io/fluxzero/$artifact"
          done
          python3 .github/scripts/verify-agent-docs-publication.py "$repository"
