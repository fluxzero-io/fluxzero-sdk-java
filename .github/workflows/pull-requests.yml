name: Build PR

on:
  pull_request:
    branches: [ main, next/2.0, 1.x ]

env:
  BUILD_ENVIRONMENT: github

jobs:
  build-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Verify repository normalization
        run: |
          git add --renormalize .
          if ! git diff --cached --quiet; then
            git diff --cached --stat
            echo "::error::Tracked files are not normalized according to .gitattributes"
            exit 1
          fi

      - name: Install Java and Maven
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Test Maven Central publication recovery
        run: bash .github/scripts/recover-central-publication.test.sh

      - name: Test release version policy
        run: bash .github/scripts/resolve-release-version.test.sh

      - name: Validate agent documentation graph
        run: |
          python3 .github/scripts/validate-agent-docs.py
          python3 .github/scripts/build-agent-docs.test.py

      - name: Run Maven build
        run: ./mvnw -B install

      - name: Verify standard Maven publication and release attachments
        run: |
          repository="$RUNNER_TEMP/maven-publication"
          ./mvnw -B -Dgpg.skip -DskipTests deploy \
            "-DaltDeploymentRepository=fluxzero::file://$repository"
          for artifact in fluxzero-sdk-java fluxzero-bom common sdk test-server proxy; do
            test -d "$repository/io/fluxzero/$artifact"
          done
          for artifact in common sdk test-server proxy; do
            test "$(find "$repository/io/fluxzero/$artifact" -name '*-sources.jar' | wc -l)" -gt 0
            test "$(find "$repository/io/fluxzero/$artifact" -name '*-javadoc.jar' | wc -l)" -gt 0
          done
          for artifact in annotation-processor-tests java-downstream-project kotlin-downstream-project; do
            test ! -e "$repository/io/fluxzero/$artifact"
          done
          python3 .github/scripts/verify-agent-docs-publication.py "$repository"
